<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সতর্কতা — মৌখামার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: #FFF; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #F5F3EC; font-weight: 600; }
  .alert-item { align-items: flex-start; }
  .alert-item .when { margin-left: auto; flex: none; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .alert-item .body { flex: 1; min-width: 0; }
  .alert-item[role="button"] { cursor: pointer; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
  .flow span.box { padding: 6px 12px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); }
  .side-col { display: flex; flex-direction: column; gap: 20px; align-self: flex-start; min-width: 0; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" data-active="alerts"></aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>সতর্কতা</h1>
        <div class="sub">কীটনাশক স্প্রে আর এলাকার রোগের খবর — নিজে থেকে তৈরি হয়</div>
      </div>
      <button class="btn" type="button" id="markAll">সব পড়া হয়েছে</button>
    </header>

    <div class="row">
      <section class="card grow-3">
        <div class="tabs" id="tabs" role="group" aria-label="সতর্কতার ধরন">
          <button type="button" aria-pressed="true" data-kind="">সব</button>
          <button type="button" aria-pressed="false" data-kind="spray">কীটনাশক স্প্রে</button>
          <button type="button" aria-pressed="false" data-kind="disease">রোগ</button>
          <button type="button" aria-pressed="false" data-kind="inspection">পরিদর্শন</button>
        </div>
        <div class="sub" style="margin-top:-4px">নতুন সতর্কতায় চাপ দিলে সেটা পড়া হয়েছে ধরা হয়</div>
        <div id="list" style="display:flex;flex-direction:column;gap:10px"></div>
      </section>

      <div class="grow-2 side-col">
        <section class="card" id="spray">
          <h2 id="sprayTitle">কীটনাশক স্প্রে-র খবর</h2>
          <div class="sub" style="margin-top:-6px" id="spraySub"></div>
          <form id="sprayForm" style="display:flex;flex-direction:column;gap:12px" hidden>
            <div class="row" style="gap:12px">
              <label class="field grow-1" style="flex-basis:140px">জেলা
                <select name="district" id="sprayDistrict" required></select>
              </label>
              <label class="field grow-1" style="flex-basis:140px">উপজেলা
                <select name="upazila" id="sprayUpazila" required></select>
              </label>
            </div>
            <label class="field">ফসল
              <select name="crop"><option>সরিষা</option><option>আলু</option><option>ধান</option><option>লিচু</option><option>সবজি</option><option>ভুট্টা</option></select>
            </label>
            <label class="field">কীটনাশকের নাম
              <input name="chemical" required maxlength="100" placeholder="যেমন: ইমিডাক্লোপ্রিড">
            </label>
            <div class="row" style="gap:12px">
              <label class="field grow-1" style="flex-basis:140px">তারিখ
                <input type="date" name="spray_date" required>
              </label>
              <label class="field grow-1" style="flex-basis:120px">সময়
                <input type="time" name="spray_time" value="08:00" required>
              </label>
            </div>
            <label class="field">মন্তব্য (ঐচ্ছিক)
              <input name="notes" maxlength="300" placeholder="যেমন: পূর্ব মাঠে">
            </label>
            <div class="err" id="sprayErr" role="alert"></div>
            <button class="btn primary" type="submit">খবর পাঠান</button>
          </form>
          <div id="sprayList" style="display:flex;flex-direction:column;gap:10px"></div>
          <div style="border-top:1px solid var(--line-2);padding-top:12px">
            <div class="sub" style="margin-bottom:8px">কীভাবে কাজ করে</div>
            <div class="flow"><span class="box">কৃষক খবর দেন</span>→<span class="box">database trigger</span>→<span class="box">ওই উপজেলার সব খামারি জানতে পারেন</span></div>
          </div>
        </section>

        <section class="card">
          <h2>এলাকায় রোগ — গত ৩০ দিন</h2>
          <div class="sub" style="margin-top:-6px">খামারিদের পরিদর্শন থেকে, উপজেলা অনুযায়ী</div>
          <div id="outbreaks"></div>
          <a class="btn" href="diseases.html" style="align-self:flex-start">রোগ ও লক্ষণ দেখুন</a>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="js/bd-locations.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  let kind = '';
  let sprays = [];
  let me = null;
  const DOT = { spray: 'red', disease: 'honey' };

  MK.start(['outbreaks'], async (user) => {
    me = user;
    // খামারি নিজের উপজেলার নোটিশ পান, কৃষক নিজের পাঠানোগুলো (backend ঠিক করে)
    sprays = await API.get('spray-alerts/');
    setupSprayForm();
    render();
    renderSprays();
    renderOutbreaks();
    if (location.hash === '#spray') document.getElementById('spray').scrollIntoView({ block: 'start' });
  });

  const canSpray = () => !!me && (me.role === 'cropper' || MK.isAdmin(me));

  // ---------- সতর্কতার তালিকা ----------
  function render() {
    const list = NOTIFICATIONS.filter((n) => !kind || n.kind === kind);
    document.getElementById('list').innerHTML = list.length ? list.map((n) => `
      <div class="alert-item ${n.unread ? 'unread' : ''}" data-id="${n.id}"${n.unread ? ' role="button" tabindex="0" title="পড়া হয়েছে ধরতে চাপুন"' : ''}>
        <span class="dot ${DOT[n.kind] || ''}"></span>
        <div class="body"><b>${escapeHtml(n.title)}${n.unread ? ' <span class="pill red" style="margin-left:6px">নতুন</span>' : ''}</b><span>${escapeHtml(n.body)}</span></div>
        <span class="when">${escapeHtml(n.when)}</span>
      </div>`).join('') : '<div class="empty">কোনো সতর্কতা নেই</div>';
    document.getElementById('markAll').disabled = !NOTIFICATIONS.some((n) => n.unread);
  }

  // sidebar-এর সংখ্যাটা নতুন করে
  function refreshUnread() {
    MK.unread = NOTIFICATIONS.filter((n) => n.unread).length;
    renderSidebar();
  }

  async function markRead(id) {
    const n = NOTIFICATIONS.find((x) => x.id === id);
    if (!n || !n.unread) return;
    try {
      await API.post(`notifications/${id}/read/`);
      n.unread = false;
      refreshUnread();
      render();
    } catch (ex) {
      toast(ex.message);
    }
  }

  const listEl = document.getElementById('list');
  listEl.addEventListener('click', (e) => {
    const item = e.target.closest('.alert-item[data-id]');
    if (item) markRead(Number(item.dataset.id));
  });
  listEl.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const item = e.target.closest('.alert-item[data-id]');
    if (item) { e.preventDefault(); markRead(Number(item.dataset.id)); }
  });

  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#tabs button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    kind = b.dataset.kind;
    render();
  });

  document.getElementById('markAll').addEventListener('click', async () => {
    try {
      const resp = await API.post('notifications/read-all/');
      NOTIFICATIONS.forEach((n) => { n.unread = false; });
      refreshUnread();
      render();
      toast(resp && resp.count ? `${bn(resp.count)}টা সতর্কতা পড়া হয়েছে` : 'সব সতর্কতা আগেই পড়া হয়েছে');
    } catch (ex) {
      toast(ex.message);
    }
  });

  // ---------- স্প্রে-র খবর ----------
  // কৃষক পাঠালে spray_alerts-এ INSERT হয়, তারপর trg_spray_alert_fanout trigger
  // ওই উপজেলার সব খামারির জন্য notifications বানায়
  function setupSprayForm() {
    const form = document.getElementById('sprayForm');
    const sub = document.getElementById('spraySub');
    if (!canSpray()) {
      form.remove();
      document.getElementById('sprayTitle').textContent = 'আপনার উপজেলায় কীটনাশক স্প্রে';
      sub.textContent = me.upazila
        ? `${me.upazila}, ${me.district} — কৃষকদের পাঠানো খবর`
        : 'প্রোফাইলে উপজেলা দিলে সেই এলাকার স্প্রে-র খবর এখানে দেখাবে';
      return;
    }
    form.hidden = false;
    document.getElementById('sprayTitle').textContent = 'কীটনাশক স্প্রে-র খবর দিন';
    sub.textContent = 'স্প্রে করার অন্তত এক দিন আগে জানান';

    const dSel = document.getElementById('sprayDistrict');
    const uSel = document.getElementById('sprayUpazila');
    const districts = Object.keys(LOCATIONS);
    dSel.innerHTML = districts.map((d) => `<option>${escapeHtml(d)}</option>`).join('');
    const fillUpazilas = (selected) => {
      uSel.innerHTML = (LOCATIONS[dSel.value] || []).map((u) => `<option>${escapeHtml(u)}</option>`).join('');
      if (selected) uSel.value = selected;
    };
    dSel.value = districts.includes(me.district) ? me.district : districts[0];
    fillUpazilas(me.upazila);
    dSel.addEventListener('change', () => fillUpazilas());
    setSprayDate();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('sprayErr');
      const f = Object.fromEntries(new FormData(form));
      if (!String(f.chemical || '').trim()) { err.textContent = 'কীটনাশকের নাম লিখুন'; return; }
      if (!f.spray_date) { err.textContent = 'তারিখ দিন'; return; }
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      err.textContent = '';
      try {
        const saved = await API.post('spray-alerts/', {
          district: f.district, upazila: f.upazila, crop: f.crop,
          chemical: String(f.chemical).trim(), spray_date: f.spray_date,
          spray_time: f.spray_time, notes: String(f.notes || '').trim()
        });
        sprays.unshift(saved);
        renderSprays();
        form.reset();
        dSel.value = f.district;
        fillUpazilas(f.upazila);
        setSprayDate();
        toast(`খবর পাঠানো হয়েছে — ${saved.upazila_name || f.upazila} উপজেলার খামারিরা সতর্কবার্তা পাবেন`);
      } catch (ex) {
        err.textContent = ex.message || 'খবর পাঠানো যায়নি';
      } finally {
        btn.disabled = false;
      }
    });
  }

  // তারিখ: আজ থেকে, স্বাভাবিকভাবে আগামীকাল
  function setSprayDate() {
    const input = document.querySelector('#sprayForm [name="spray_date"]');
    if (!input) return;
    const t = new Date();
    input.min = isoDate(t);
    input.value = isoDate(new Date(t.getTime() + 86400000));
  }

  function renderSprays() {
    const el = document.getElementById('sprayList');
    if (!sprays.length) {
      el.innerHTML = `<div class="empty">${canSpray() ? 'আপনি এখনো কোনো খবর পাঠাননি' : 'আপনার উপজেলায় স্প্রে-র কোনো খবর নেই'}</div>`;
      return;
    }
    el.innerHTML = (canSpray() ? '<b style="font-size:14px">আপনার পাঠানো খবর</b>' : '') + sprays.slice(0, 8).map((s) => `
      <div class="alert-item">
        <span class="dot red"></span>
        <div class="body">
          <b>${escapeHtml(s.crop_name || '')} খেতে ${escapeHtml(s.chemical || 'কীটনাশক')}</b>
          <span>${MK.date(s.spray_date)}${s.spray_time ? ', ' + escapeHtml(toBnDigits(s.spray_time)) : ''} · ${escapeHtml(s.upazila_name || '')}, ${escapeHtml(s.district_name || '')}${canSpray() ? '' : ' · কৃষক: ' + escapeHtml(s.cropper_name || '')}${s.notes ? ' · ' + escapeHtml(s.notes) : ''}</span>
        </div>
      </div>`).join('');
  }

  // ---------- এলাকার রোগ ----------
  const RISK = { high: ['বেশি ঝুঁকি', 'red'], mid: ['মাঝারি', 'honey'], low: ['কম', 'green'] };
  function renderOutbreaks() {
    const el = document.getElementById('outbreaks');
    el.innerHTML = OUTBREAKS.length ? OUTBREAKS.map((o) => {
      const r = RISK[o.risk] || ['', 'gray'];
      return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)">
        <span style="flex:1;min-width:0"><b>${escapeHtml(o.disease)}</b> <span class="pill ${r[1]}">${r[0]}</span>${o.alert ? ' <span class="pill red">সতর্কতা</span>' : ''}<br>
        <span class="sub">${escapeHtml(o.where)} · শেষ দেখা ${MK.date(o.last_seen)}</span></span>
        <b style="font-size:20px">${bn(Number(o.farms) || 0)}</b><span class="sub">খামার</span></div>`;
    }).join('') : '<div class="empty">গত ৩০ দিনে কোনো খামারের পরিদর্শনে রোগ লেখা হয়নি</div>';
  }
</script>
</body>
</html>
