<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সতর্কতা — মৌখামার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: #FFF; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #F5F3EC; font-weight: 600; }
  .alert-item { align-items: flex-start; }
  .alert-item .when { margin-left: auto; flex: none; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .alert-item .body { flex: 1; min-width: 0; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
  .flow span.box { padding: 6px 12px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" data-active="alerts"></aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>সতর্কতা</h1>
        <div class="sub">কীটনাশক স্প্রে আর এলাকার রোগের খবর — নিজে থেকে তৈরি হয়</div>
      </div>
      <button class="btn" type="button" id="markAll">সব পড়া হয়েছে</button>
    </header>

    <div class="row">
      <section class="card grow-3">
        <div class="tabs" id="tabs" role="group" aria-label="সতর্কতার ধরন">
          <button type="button" aria-pressed="true" data-kind="">সব</button>
          <button type="button" aria-pressed="false" data-kind="spray">কীটনাশক স্প্রে</button>
          <button type="button" aria-pressed="false" data-kind="disease">রোগ</button>
        </div>
        <div id="list" style="display:flex;flex-direction:column;gap:10px"></div>
      </section>

      <section class="card grow-2" id="spray" style="align-self:flex-start">
        <h2>কীটনাশক স্প্রে-র খবর দিন</h2>
        <div class="sub" style="margin-top:-6px">কৃষকদের জন্য — স্প্রে করার অন্তত এক দিন আগে জানান</div>
        <form id="sprayForm" style="display:flex;flex-direction:column;gap:12px">
          <label class="field">উপজেলা
            <select name="upazila" id="sprayUpazila"></select>
          </label>
          <label class="field">ফসল
            <select name="crop"><option>সরিষা</option><option>আলু</option><option>ধান</option><option>লিচু</option><option>সবজি</option></select>
          </label>
          <label class="field">কীটনাশকের নাম
            <input name="pesticide" required placeholder="যেমন: ইমিডাক্লোপ্রিড">
          </label>
          <div class="row" style="gap:12px">
            <label class="field grow-1" style="flex-basis:140px">তারিখ
              <input type="date" name="date" value="2026-11-05" min="2026-11-02" required>
            </label>
            <label class="field grow-1" style="flex-basis:120px">সময়
              <input type="time" name="time" value="08:00" required>
            </label>
          </div>
          <button class="btn primary" type="submit">খবর পাঠান</button>
        </form>
        <div style="border-top:1px solid var(--line-2);padding-top:12px">
          <div class="sub" style="margin-bottom:8px">কীভাবে কাজ করে</div>
          <div class="flow"><span class="box">কৃষক খবর দেন</span>→<span class="box">database trigger</span>→<span class="box">ওই উপজেলার সব খামারি জানতে পারেন</span></div>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  let kind = '';
  const isCropper = currentUser().role === 'cropper' || location.hash === '#spray';

  function render() {
    const list = NOTIFICATIONS.filter((n) => !kind || n.kind === kind);
    document.getElementById('list').innerHTML = list.length ? list.map((n, i) => `
      <div class="alert-item ${n.unread ? 'unread' : ''}">
        <span class="dot ${n.kind === 'spray' ? 'red' : 'honey'}"></span>
        <div class="body"><b>${n.title}${n.unread ? ' <span class="pill red" style="margin-left:6px">নতুন</span>' : ''}</b><span>${n.body}</span></div>
        <span class="when">${n.when}</span>
      </div>`).join('') : '<div class="empty">কোনো সতর্কতা নেই</div>';
    const unread = NOTIFICATIONS.filter((n) => n.unread).length;
    const badge = document.querySelector('.nav a.active .count');
    if (badge) { badge.textContent = bn(unread); badge.style.display = unread ? '' : 'none'; }
    const dot = document.querySelector('.topbar .dot-count');
    if (dot) { dot.textContent = bn(unread); dot.style.display = unread ? '' : 'none'; }
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#tabs button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    kind = b.dataset.kind;
    render();
  });

  document.getElementById('markAll').addEventListener('click', () => {
    NOTIFICATIONS.forEach((n) => { n.unread = false; });
    Store.save();
    render();
    toast('সব সতর্কতা পড়া হয়েছে');
  });

  // স্প্রে-র খবর — backend-এ INSERT INTO spray_alerts, তারপর trigger নিজে notifications বানাবে
  const upazilas = [...new Set(FARMERS.map((f) => f.upazila + ', ' + f.district))];
  document.getElementById('sprayUpazila').innerHTML = upazilas.map((u) => `<option>${u}</option>`).join('');
  document.getElementById('sprayForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const place = f.get('upazila');
    const upazila = place.split(',')[0];
    const reached = FARMERS.filter((x) => x.upazila === upazila).length;
    const [y, m, d] = String(f.get('date')).split('-');
    NOTIFICATIONS.unshift({
      kind: 'spray', unread: true,
      title: 'কীটনাশক স্প্রে — ' + upazila,
      body: `${bn(Number(d))}/${bn(Number(m))}/${bn(y)}, ${bn(f.get('time'))}-এ ${f.get('crop')} খেতে ${f.get('pesticide')} স্প্রে হবে। বাক্স ঢেকে রাখুন বা সরান।`,
      when: 'এইমাত্র'
    });
    Store.save();
    e.target.reset();
    setSprayDate();
    document.querySelectorAll('#tabs button')[0].click();
    toast(`${upazila} উপজেলার ${bn(reached)} জন খামারি সতর্কবার্তা পেলেন`);
  });

  // তারিখ: আজ থেকে, স্বাভাবিকভাবে আগামীকাল
  function setSprayDate() {
    const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const input = document.querySelector('#sprayForm [name="date"]');
    const t = new Date();
    input.min = iso(t);
    input.value = iso(new Date(t.getTime() + 86400000));
  }
  setSprayDate();

  render();
  if (isCropper) document.getElementById('spray').scrollIntoView({ block: 'start' });
</script>
</body>
</html>
