<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পরিদর্শন — মৌখামার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .q { display: flex; flex-direction: column; gap: 6px; }
  .q > span { font-size: 14px; color: var(--muted-2); }
  .due { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-2); }
  .due b { flex: 0 0 72px; }
  .due .w { flex: 1; font-size: 14px; color: var(--muted-2); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" data-active="hives"></aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>পরিদর্শন</h1>
        <div class="sub">বাক্স খুলে যা দেখলেন তা লিখুন — রানী, শক্তি, মধু আর রোগ</div>
      </div>
      <a class="btn primary" href="#new">+ নতুন পরিদর্শন</a>
    </header>

    <section class="stats" id="kpis" aria-label="সারাংশ" style="margin-bottom:4px"></section>

    <div class="dash-grid">
      <div class="dash-col">
        <section class="card" id="new">
          <h2>নতুন পরিদর্শন</h2>
          <div class="row" style="gap:16px">
            <label class="field grow-1">বাক্স
              <select id="hive"></select>
            </label>
            <label class="field grow-1">তারিখ
              <input type="date" id="date">
            </label>
            <label class="field grow-1">মধুভরা ফ্রেম
              <input type="number" id="filled" min="0" max="20" value="0">
            </label>
          </div>
          <div class="row" style="gap:16px">
            <div class="q grow-1"><span>রানী</span>
              <div class="seg" id="queen"><button type="button" aria-pressed="true" data-v="yes">দেখা গেছে</button><button type="button" aria-pressed="false" data-v="no">দেখা যায়নি</button><button type="button" aria-pressed="false" data-v="eggs">শুধু ডিম</button></div></div>
            <div class="q grow-1"><span>কলোনির অবস্থা</span>
              <div class="seg" id="state"><button type="button" aria-pressed="true">সবল</button><button type="button" aria-pressed="false">দুর্বল</button><button type="button" aria-pressed="false">রানীহীন</button></div></div>
          </div>
          <div class="q"><span>পাওয়া রোগ বা শত্রু (একাধিক বাছা যায়)</span>
            <div class="chips" id="chips"></div>
          </div>
          <label class="field">মন্তব্য
            <input type="text" id="note" placeholder="যেমন: বাক্সের পায়ে পিঁপড়া">
          </label>
          <div class="err" id="err" role="alert"></div>
          <div class="btns"><button class="btn dark" type="button" id="save">পরিদর্শন সংরক্ষণ করুন</button></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>সব পরিদর্শন</h2>
            <label class="field" style="flex-direction:row;align-items:center;gap:8px">খামার
              <select id="farmFilter" style="min-height:38px"></select>
            </label>
          </div>
          <div class="table-wrap">
            <table style="min-width:680px">
              <thead><tr><th>তারিখ</th><th>বাক্স</th><th>রানী</th><th>অবস্থা</th><th class="num">মধুভরা ফ্রেম</th><th>রোগ</th><th>মন্তব্য</th></tr></thead>
              <tbody id="log"></tbody>
            </table>
          </div>
        </section>
      </div>

      <div class="dash-col">
        <section class="card">
          <div class="card-head"><h2>পরিদর্শন বাকি</h2><span class="sub">১৪ দিনের বেশি</span></div>
          <div id="due"></div>
        </section>
        <section class="card">
          <h2>এ মাসে পাওয়া রোগ</h2>
          <div id="found"></div>
          <a class="btn" href="diseases.html">লক্ষণ দিয়ে রোগ খুঁজুন</a>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  // পরিদর্শন — সব বাক্সের পরিদর্শনের তালিকা আর নতুন পরিদর্শন লেখা।
  // লেখার কাজ sp_record_inspection procedure করে: পরিদর্শন, রোগ (junction),
  // বাক্সের অবস্থা আর ইতিহাসের ঘটনা — একটা transaction-এ।
  const $ = (id) => document.getElementById(id);
  const DAY = 86400000;
  const STATE_PILL = { 'সবল': 'green', 'দুর্বল': 'honey', 'রানীহীন': 'red' };
  const hiveOf = (i) => HIVES.find((h) => h.id === i.hiveId);
  const pressed = (id) => document.querySelector(`#${id} [aria-pressed="true"]`);
  const daysAgo = (iso) => Math.floor((Date.now() - new Date(iso + 'T00:00:00').getTime()) / DAY);
  const recent = (days) => INSPECTIONS.filter((i) => daysAgo(i.date) < days);

  function queenCell(i) {
    if (i.queenSeen) return 'দেখা গেছে';
    return i.eggsSeen ? '<span class="pill honey">শুধু ডিম</span>' : '<span class="pill red">দেখা যায়নি</span>';
  }

  function renderKpis() {
    const month = recent(30);
    const items = [
      { k: 'এই সপ্তাহে পরিদর্শন', v: bn(recent(7).length), ic: 'inspections', c: 'blue' },
      { k: 'পরিদর্শন বাকি', v: bn(HIVES.filter((h) => h.overdue).length), ic: 'warn', c: 'red' },
      { k: 'রোগ পাওয়া গেছে (৩০ দিনে)', v: bn(month.filter((i) => i.diseases.length).length), ic: 'diseases', c: 'honey' },
      { k: 'রানী দেখা যায়নি (৩০ দিনে)', v: bn(month.filter((i) => !i.queenSeen).length), ic: 'crown', c: 'red' }
    ];
    // .stat — style.css-এ সাজানো (আগের .kpi ক্লাসের কোনো CSS ছিল না)
    $('kpis').innerHTML = items.map((x) =>
      `<div class="stat"><div class="k">${x.k}</div><div class="v${x.c === 'honey' ? ' honey' : ''}">${x.v}</div></div>`).join('');
  }

  function renderLog() {
    const f = Number($('farmFilter').value);
    const rows = INSPECTIONS.filter((i) => !f || (hiveOf(i) || {}).farm === f);
    $('log').innerHTML = rows.map((i) => {
      const h = hiveOf(i) || {};
      const link = 'hive.html?code=' + encodeURIComponent(i.hive);
      return `
      <tr class="link-row" data-href="${escapeHtml(link)}">
        <td>${MK.date(i.date)}</td><td><a href="${escapeHtml(link)}"><b>${escapeHtml(i.hive)}</b></a><br><span class="sub">${escapeHtml(h.farmName || '')}</span></td>
        <td>${queenCell(i)}</td>
        <td><span class="pill ${STATE_PILL[i.state] || 'gray'}">${escapeHtml(i.state)}</span></td>
        <td class="num">${bn(i.framesFilled)}</td>
        <td>${i.diseases.length ? i.diseases.map((d) => `<a class="pill red" style="text-decoration:none" href="diseases.html?d=${encodeURIComponent(d.code)}">${escapeHtml(d.name)}</a>`).join(' ') : '<span class="sub">নেই</span>'}</td>
        <td class="sub">${escapeHtml(i.notes) || '—'}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="empty">কোনো পরিদর্শন নেই</td></tr>';
  }

  function renderDue() {
    // v_hive_status-এর নিয়ম: ১৪ দিনের বেশি, বা কখনো পরিদর্শন হয়নি
    const days = (h) => (h.last === null || h.last === undefined ? 1e9 : h.last);
    const due = HIVES.filter((h) => h.overdue).sort((a, b) => days(b) - days(a));
    $('due').innerHTML = due.map((h) =>
      `<div class="due"><b>${escapeHtml(h.code)}</b><span class="w">${escapeHtml(h.farmName)}<br><span style="color:var(--red);font-weight:600">${h.last === null ? 'কখনো পরিদর্শন হয়নি' : bn(h.last) + ' দিন আগে'}</span></span>
        <button class="btn" type="button" data-hive="${h.id}" style="min-height:38px;padding:0 12px;font-size:14px">এখন করুন</button></div>`).join('')
      || '<div class="empty">সব বাক্সের পরিদর্শন সময়মতো হয়েছে</div>';
  }

  function renderFound() {
    // গত ৩০ দিনে কোন রোগ কয়টা বাক্সে
    const hives = {};
    recent(30).forEach((i) => i.diseases.forEach((d) => { (hives[d.name] = hives[d.name] || new Set()).add(i.hive); }));
    $('found').innerHTML = Object.entries(hives).sort((a, b) => b[1].size - a[1].size).map(([d, set]) =>
      `<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line-2)"><span>${escapeHtml(d)}</span><b>${bn(set.size)}টা বাক্সে</b></div>`).join('')
      || '<div class="empty">গত ৩০ দিনে কোনো রোগ পাওয়া যায়নি</div>';
  }

  function fillHiveSelect(selectedId) {
    const sel = $('hive');
    sel.innerHTML = HIVES.map((h) => `<option value="${h.id}">${escapeHtml(h.code)} · ${escapeHtml(h.farmName)}</option>`).join('');
    if (selectedId) sel.value = String(selectedId);
    syncFrames();
  }

  // বাছাই করা বাক্সের ফ্রেম সংখ্যা অনুযায়ী সর্বোচ্চ মান আর এখনকার অবস্থা
  function syncFrames() {
    const h = HIVES.find((x) => x.id === Number($('hive').value));
    if (!h) return;
    $('filled').max = h.frames;
    $('filled').value = h.filled;
    document.querySelectorAll('#state button').forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === h.state)));
  }

  function renderAll() {
    renderKpis(); renderLog(); renderDue(); renderFound();
  }

  MK.start(['farms', 'hives', 'inspections', 'diseases'], () => {
    const params = new URLSearchParams(location.search);
    const fromUrl = HIVES.find((h) => h.code === params.get('code'));
    $('date').value = isoDate();
    $('date').max = isoDate();
    $('farmFilter').innerHTML = '<option value="0">সব</option>' + FARMS.map((f) => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');
    fillHiveSelect(fromUrl && fromUrl.id);
    if (!HIVES.length) {
      $('save').disabled = true;
      $('err').textContent = 'আগে "খামার ও বাক্স" পাতা থেকে একটা বাক্স যোগ করুন';
    }

    const chips = $('chips');
    chips.innerHTML = DISEASES.map((d) => `<button type="button" class="chip" aria-pressed="false" data-code="${escapeHtml(d.id)}">${escapeHtml(d.name)}</button>`).join('');
    chips.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    });

    $('hive').addEventListener('change', syncFrames);
    $('farmFilter').addEventListener('change', renderLog);
    $('log').addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      const tr = e.target.closest('tr[data-href]');
      if (tr) location.href = tr.dataset.href;
    });
    $('due').addEventListener('click', (e) => {
      const b = e.target.closest('[data-hive]');
      if (!b) return;
      $('hive').value = b.dataset.hive;
      syncFrames();
      $('new').scrollIntoView({ behavior: 'smooth' });
    });

    $('save').addEventListener('click', async (e) => {
      const err = $('err');
      const hive = HIVES.find((h) => h.id === Number($('hive').value));
      const filled = Number($('filled').value);
      if (!hive) { err.textContent = 'বাক্স বাছুন'; return; }
      if (!$('date').value) { err.textContent = 'তারিখ দিন'; return; }
      if (!Number.isInteger(filled) || filled < 0) { err.textContent = 'মধুভরা ফ্রেমের সংখ্যা ঠিকভাবে লিখুন'; return; }
      // এক বাক্সে দিনে একটাই পরিদর্শন (UNIQUE hive + তারিখ) — backend-এর বার্তা ইংরেজিতে আসে
      if (INSPECTIONS.some((i) => i.hiveId === hive.id && i.date === $('date').value)) {
        err.textContent = `${hive.code}-এর এই তারিখের পরিদর্শন আগেই লেখা হয়েছে`;
        return;
      }
      const q = pressed('queen').dataset.v;
      const body = {
        hive: hive.id, date: $('date').value, frames_filled: filled, state: pressed('state').textContent,
        queen_seen: q === 'yes', eggs_seen: q !== 'no', notes: $('note').value.trim(),
        disease_codes: [...chips.querySelectorAll('[aria-pressed="true"]')].map((b) => b.dataset.code)
      };
      err.textContent = '';
      e.target.disabled = true;
      try {
        await API.post('inspections/', body);
        await MK.load('inspections', 'hives');
        chips.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', 'false'));
        $('note').value = '';
        fillHiveSelect(hive.id);
        renderAll();
        toast(hive.code + ' পরিদর্শন সংরক্ষণ হয়েছে');
      } catch (ex) {
        err.textContent = ex.message || 'পরিদর্শন সংরক্ষণ হয়নি';
      } finally {
        e.target.disabled = false;
      }
    });

    renderAll();
  });
</script>
</body>
</html>
