<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আমার প্রোফাইল — মৌখামার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" data-active=""></aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1 id="pageTitle">আমার প্রোফাইল</h1>
        <div class="sub" id="pageSub">আপনার তথ্য দেখুন ও বদলান</div>
      </div>
      <div class="btns" id="headBtns"></div>
    </header>

    <section class="card">
      <div class="profile-head">
        <span class="avatar xl" id="avatar"></span>
        <div>
          <h2 id="pName"></h2>
          <div class="sub" id="pMeta"></div>
        </div>
      </div>
      <section class="stats" id="pStats" aria-label="সারাংশ"></section>
    </section>

    <div class="row" id="editArea">
      <section class="card grow-3">
        <h2>তথ্য বদলান</h2>
        <form id="profileForm" class="form-grid" novalidate>
          <label class="field full">পুরো নাম
            <input name="name" required>
          </label>
          <label class="field">মোবাইল নম্বর
            <input name="phone" type="tel" disabled>
            <span class="hint">নম্বর বদলাতে হলে নতুন করে নিবন্ধন করুন</span>
          </label>
          <label class="field">জেলা
            <select name="district" id="district"></select>
          </label>
          <label class="field">উপজেলা
            <select name="upazila" id="upazila"></select>
          </label>
          <label class="field farmer-only">খামারের নাম
            <input name="farm">
          </label>
          <label class="field farmer-only">খামারের ধরন
            <select name="type"><option>ভ্রাম্যমাণ</option><option>স্থায়ী</option></select>
          </label>
          <label class="field farmer-only">অভিজ্ঞতা (বছর)
            <input name="exp" type="number" min="0" max="60">
          </label>
          <label class="field cropper-only">প্রধান ফসল
            <select name="crop"><option>সরিষা</option><option>আলু</option><option>ধান</option><option>লিচু</option><option>সবজি</option><option>কালোজিরা</option></select>
          </label>
          <div class="full">
            <div class="err" id="err" role="alert"></div>
            <button class="btn primary" type="submit">সংরক্ষণ করুন</button>
          </div>
        </form>
      </section>

      <section class="card grow-2" style="align-self:flex-start">
        <h2>পাসওয়ার্ড বদলান</h2>
        <form id="pwForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
          <label class="field">বর্তমান পাসওয়ার্ড
            <input name="old" type="password" autocomplete="current-password" required>
          </label>
          <label class="field">নতুন পাসওয়ার্ড
            <input name="new1" type="password" autocomplete="new-password" minlength="6" required>
          </label>
          <label class="field">আবার নতুন পাসওয়ার্ড
            <input name="new2" type="password" autocomplete="new-password" required>
          </label>
          <div class="err" id="pwErr" role="alert"></div>
          <button class="btn" type="submit">পাসওয়ার্ড বদলান</button>
        </form>
      </section>
    </div>
  </main>
</div>

<script src="js/bd-locations.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  // ?farmer=<নাম> থাকলে খামারি তালিকা থেকে অন্য খামারির প্রোফাইল (শুধু দেখা যায়)
  const otherName = new URLSearchParams(location.search).get('farmer');
  const other = otherName ? FARMERS.find((f) => f.name === otherName) : null;
  const me = Session.get() || {};
  const initial = (name) => [...String(name).replace(/^(মো\.|মোছা\.|মোঃ)\s*/, '')][0] || 'ম';

  function renderHead(p, isFarmer) {
    document.getElementById('avatar').textContent = initial(p.name);
    document.getElementById('pName').textContent = p.name;
    document.getElementById('pMeta').textContent = [isFarmer ? 'খামারি' : 'কৃষক', [p.upazila, p.district].filter(Boolean).join(', '), p.farm, p.type].filter(Boolean).join(' · ');
  }

  if (other) {
    // ---- অন্য খামারির প্রোফাইল ----
    document.title = other.name + ' — মৌখামার';
    document.getElementById('pageTitle').textContent = other.name;
    document.getElementById('pageSub').innerHTML = '<a href="directory.html">খামারি তালিকা</a> থেকে';
    document.getElementById('editArea').hidden = true;
    renderHead(other, true);
    const stats = [
      { k: 'বাক্স', v: bn(other.hives) },
      { k: 'অভিজ্ঞতা', v: bn(other.exp) + ' বছর' },
      { k: 'ধরন', v: other.type },
      { k: 'ফুলের উৎস', v: other.flora.join(', '), cls: 'honey' }
    ];
    document.getElementById('pStats').innerHTML = stats.map((s) => `<div class="stat"><div class="k">${s.k}</div><div class="v ${s.cls || ''}" style="font-size:18px">${s.v}</div></div>`).join('');
    document.getElementById('headBtns').innerHTML = `<a class="btn" href="directory.html">← তালিকায় ফিরুন</a>
      <a class="btn primary" href="#" data-toast="মোবাইল নম্বর দেখানো backend-এ গোপনীয়তা নিয়ম মেনে হবে">যোগাযোগ</a>`;
  } else {
    // ---- নিজের প্রোফাইল ----
    const isFarmer = me.role !== 'cropper';
    document.querySelectorAll(isFarmer ? '.cropper-only' : '.farmer-only').forEach((el) => el.remove());
    renderHead(me, isFarmer);

    const stats = isFarmer
      ? [
          { k: 'খামার', v: bn(FARMS.length) },
          { k: 'বাক্স', v: bn(HIVES.length) },
          { k: 'এই মৌসুমে মধু', v: bn(HARVESTS.filter((h) => h.season === 'now').reduce((s, h) => s + h.kg, 0)) + ' কেজি', cls: 'honey' },
          { k: 'পরিদর্শন', v: bn(INSPECTIONS.length) + 'টা' }
        ]
      : [
          { k: 'পাঠানো স্প্রে-র খবর', v: bn(NOTIFICATIONS.filter((n) => n.kind === 'spray').length) + 'টা' },
          { k: 'এলাকা', v: me.upazila || '—' },
          { k: 'প্রধান ফসল', v: me.crop || '—', cls: 'honey' }
        ];
    document.getElementById('pStats').innerHTML = stats.map((s) => `<div class="stat"><div class="k">${s.k}</div><div class="v ${s.cls || ''}">${s.v}</div></div>`).join('');
    document.getElementById('headBtns').innerHTML = isFarmer
      ? '<a class="btn" href="hives.html">আমার খামার</a>'
      : '<a class="btn primary" href="alerts.html#spray">স্প্রে-র খবর দিন</a>';

    // form-এ বর্তমান তথ্য বসানো
    const form = document.getElementById('profileForm');
    const districtSel = document.getElementById('district');
    const upazilaSel = document.getElementById('upazila');
    const districts = Object.keys(LOCATIONS);
    if (me.district && !districts.includes(me.district)) districts.unshift(me.district);
    districtSel.innerHTML = districts.map((d) => `<option>${d}</option>`).join('');
    function fillUpazilas(selected) {
      const list = (LOCATIONS[districtSel.value] || []).slice();
      if (selected && !list.includes(selected)) list.unshift(selected);
      upazilaSel.innerHTML = list.map((u) => `<option>${u}</option>`).join('');
      if (selected) upazilaSel.value = selected;
    }
    districtSel.value = me.district || districts[0];
    fillUpazilas(me.upazila);
    districtSel.addEventListener('change', () => fillUpazilas());
    ['name', 'phone', 'farm', 'type', 'exp', 'crop'].forEach((k) => { if (form.elements[k] && me[k] !== undefined) form.elements[k].value = me[k]; });

    // ব্যবহারকারীর সংরক্ষিত কপি (demo user বদলালে USERS-এ কপি রাখা হয়)
    function storedUser() {
      let u = USERS.find((x) => x.phone === me.phone);
      if (!u) {
        const demo = DEMO_USERS.find((x) => x.phone === me.phone);
        if (!demo) return null;
        u = Object.assign({}, demo);
        USERS.push(u);
      }
      return u;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      const f = Object.fromEntries(new FormData(form));
      if (String(f.name).trim().length < 3) { err.textContent = 'পুরো নাম লিখুন'; return; }
      if (isFarmer && !String(f.farm || '').trim()) { err.textContent = 'খামারের নাম লিখুন'; return; }
      const changes = { name: String(f.name).trim(), district: f.district, upazila: f.upazila };
      if (isFarmer) Object.assign(changes, { farm: String(f.farm).trim(), type: f.type, exp: Number(f.exp) || 0 });
      else changes.crop = f.crop;

      if (API.useBackend) {
        try { await API.patch('me/', changes); } catch (ex) { err.textContent = 'সংরক্ষণ হয়নি, আবার চেষ্টা করুন'; return; }
      } else {
        const u = storedUser();
        if (u) Object.assign(u, changes);
        Store.save();
      }
      err.textContent = '';
      Session.set(Object.assign({}, me, changes));
      toast('প্রোফাইল সংরক্ষণ হয়েছে');
      setTimeout(() => location.reload(), 600);
    });

    document.getElementById('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('pwErr');
      const f = Object.fromEntries(new FormData(e.target));
      if (String(f.new1).length < 6) { err.textContent = 'নতুন পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে'; return; }
      if (f.new1 !== f.new2) { err.textContent = 'দুই নতুন পাসওয়ার্ড মেলেনি'; return; }
      if (API.useBackend) {
        try { await API.post('auth/password/', { old_password: f.old, new_password: f.new1 }); }
        catch (ex) { err.textContent = 'বর্তমান পাসওয়ার্ড ভুল'; return; }
      } else {
        const u = storedUser();
        if (!u || u.password !== f.old) { err.textContent = 'বর্তমান পাসওয়ার্ড ভুল'; return; }
        u.password = f.new1;
        Store.save();
      }
      err.textContent = '';
      e.target.reset();
      toast('পাসওয়ার্ড বদলানো হয়েছে');
    });
  }
</script>
</body>
</html>
