<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>খামারি তালিকা — মৌখামার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" data-active="directory"></aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>খামারি তালিকা</h1>
        <div class="sub">কোন এলাকায় কোন খামারি আছেন — জেলা, উপজেলা আর ফুল দিয়ে খুঁজুন</div>
      </div>
      <div class="btns">
        <a class="btn primary" href="map.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><path d="M8 2v16M16 6v16"/></svg>
          বাংলাদেশ ম্যাপ ভিউ
        </a>
      </div>
    </header>

    <section class="card" aria-label="ফিল্টার" style="flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:16px 18px">
      <label class="field" style="flex:2 1 220px">নাম বা খামার
        <input type="search" id="q" placeholder="যেমন: করিম, মধুকুঞ্জ">
      </label>
      <label class="field" style="flex:1 1 160px">জেলা
        <select id="district"></select>
      </label>
      <label class="field" style="flex:1 1 160px">উপজেলা
        <select id="upazila"></select>
      </label>
      <label class="field" style="flex:1 1 160px">ফুলের ধরন
        <select id="flora"></select>
      </label>
      <label class="field" style="flex:1 1 140px">ধরন
        <select id="type"><option value="">সব</option><option>ভ্রাম্যমাণ</option><option>স্থায়ী</option></select>
      </label>
    </section>

    <section class="stats" id="areaStats" aria-label="এলাকার সারাংশ"></section>

    <div class="row">
      <section class="grow-3" style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <div class="card-head"><h2 style="font-size:18px" id="resultTitle"></h2></div>
        <div class="cards" id="cards"></div>
      </section>

      <section class="card grow-2" style="align-self:flex-start">
        <h2>জেলাভিত্তিক সারাংশ</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>জেলা</th><th class="num">খামারি</th><th class="num">মোট বাক্স</th></tr></thead>
            <tbody id="byDistrict"></tbody>
          </table>
        </div>
        <div class="sub">গোপনীয়তার জন্য শুধু উপজেলা পর্যায়ের অবস্থান দেখানো হয়।</div>
      </section>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const uniq = (arr) => [...new Set(arr)];

  $('district').innerHTML = '<option value="">সব জেলা</option>' + uniq(FARMERS.map((f) => f.district)).map((d) => `<option>${d}</option>`).join('');
  $('flora').innerHTML = '<option value="">সব ফুল</option>' + FLORA.filter((f) => !f.dearth).map((f) => `<option>${f.name}</option>`).join('');

  function fillUpazila() {
    const d = $('district').value;
    const list = uniq(FARMERS.filter((f) => !d || f.district === d).map((f) => f.upazila));
    $('upazila').innerHTML = '<option value="">সব উপজেলা</option>' + list.map((u) => `<option>${u}</option>`).join('');
  }

  // backend-এ: users JOIN profiles JOIN apiaries JOIN upazilas JOIN districts ... WHERE ...
  function render() {
    const q = $('q').value.trim();
    const d = $('district').value, u = $('upazila').value, fl = $('flora').value, t = $('type').value;
    const list = FARMERS.filter((f) =>
      (!q || f.name.includes(q) || f.farm.includes(q)) && (!d || f.district === d) && (!u || f.upazila === u) &&
      (!fl || f.flora.includes(fl)) && (!t || f.type === t));

    const place = u ? `${u}, ${d}` : d || 'সারা দেশ';
    $('resultTitle').textContent = `${place} — ${bn(list.length)} জন খামারি`;
    const totalHives = list.reduce((s, f) => s + f.hives, 0);
    $('areaStats').innerHTML = [
      ['খামারি', bn(list.length)],
      ['মোট বাক্স', bn(totalHives)],
      ['গড় বাক্স', list.length ? bn(Math.round(totalHives / list.length)) : '০'],
      ['ভ্রাম্যমাণ', bn(list.filter((f) => f.type === 'ভ্রাম্যমাণ').length)]
    ].map((s) => `<div class="stat"><div class="k">${s[0]}</div><div class="v">${s[1]}</div></div>`).join('');

    $('cards').innerHTML = list.length ? list.map((f) => `
      <article class="farmer">
        <div class="top">
          <span class="avatar">${f.name.charAt(0)}</span>
          <div class="who"><b>${f.farm}</b><span>${f.name} · ${bn(f.exp)} বছরের অভিজ্ঞতা</span></div>
          <span class="pill ${f.type === 'ভ্রাম্যমাণ' ? 'blue' : 'gray'}">${f.type}</span>
        </div>
        <div class="meta"><span><b style="color:var(--ink)">${bn(f.hives)}</b> বাক্স</span><span>${f.upazila}, ${f.district}</span></div>
        <div class="chips">${f.flora.map((x) => `<span class="pill honey">${x}</span>`).join('')}</div>
        <div class="btns">
          <a class="btn primary" href="map.html?farmer=${f.id}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><path d="M8 2v16M16 6v16"/></svg>
            ম্যাপ ও প্রোফাইল দেখুন
          </a>
        </div>
      </article>`).join('') : '<div class="empty">এই filter-এ কোনো খামারি নেই</div>';
    setupDemoButtons();

    // GROUP BY district
    const groups = {};
    list.forEach((f) => { groups[f.district] = groups[f.district] || { n: 0, h: 0 }; groups[f.district].n++; groups[f.district].h += f.hives; });
    $('byDistrict').innerHTML = Object.entries(groups).sort((a, b) => b[1].h - a[1].h)
      .map(([k, v]) => `<tr><td>${k}</td><td class="num">${bn(v.n)}</td><td class="num">${bn(v.h)}</td></tr>`).join('')
      || '<tr><td colspan="3" class="empty">—</td></tr>';
  }

  $('district').addEventListener('change', () => { fillUpazila(); render(); });
  ['upazila', 'flora', 'type'].forEach((id) => $(id).addEventListener('change', render));
  $('q').addEventListener('input', render);

  fillUpazila();
  render();
</script>
</body>
</html>
