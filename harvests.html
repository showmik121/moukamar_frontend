<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মধু সংগ্রহ — মৌখামার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .err { color: var(--red); font-size: 13px; min-height: 18px; }
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-2); text-decoration: none; color: var(--ink); }
  .rank-row:hover { color: var(--ink); background: var(--soft); }
  .rank-row .nm { flex: 1; }
  .moist-ok { color: var(--green); font-weight: 600; }
  .moist-hi { color: var(--honey-ink); font-weight: 600; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" data-active="harvests"></aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>মধু সংগ্রহ</h1>
        <div class="sub">কোন বাক্স থেকে কবে কত কেজি, কোন ফুলের মধু</div>
      </div>
      <a class="btn primary" href="#new">+ সংগ্রহ লিখুন</a>
    </header>

    <section class="kpis" id="kpis" aria-label="সারাংশ"></section>

    <div class="dash-grid">
      <div class="dash-col">
        <section class="card">
          <div class="card-head">
            <h2>সংগ্রহের তালিকা</h2>
            <div class="seg-sm" role="group" aria-label="মৌসুম" id="season">
              <button type="button" aria-pressed="true" data-s="now">এই মৌসুম</button>
              <button type="button" aria-pressed="false" data-s="last">গত মৌসুম</button>
              <button type="button" aria-pressed="false" data-s="">সব</button>
            </div>
          </div>
          <div class="table-wrap">
            <table style="min-width:600px">
              <thead><tr><th>তারিখ</th><th>বাক্স</th><th>ফুলের উৎস</th><th class="num">পরিমাণ</th><th class="num">আর্দ্রতা</th></tr></thead>
              <tbody id="log"></tbody>
              <tfoot><tr><td colspan="3"><b>মোট</b></td><td class="num"><b id="total"></b></td><td></td></tr></tfoot>
            </table>
          </div>
        </section>
      </div>

      <div class="dash-col">
        <section class="card" id="new">
          <h2>নতুন সংগ্রহ</h2>
          <label class="field">বাক্স
            <select id="hive"></select>
          </label>
          <div class="row" style="gap:12px">
            <label class="field grow-1" style="flex-basis:120px">পরিমাণ (কেজি)
              <input type="number" id="kg" min="0" step="0.1" placeholder="যেমন ১২.৫">
            </label>
            <label class="field grow-1" style="flex-basis:120px">আর্দ্রতা (%)
              <input type="number" id="moist" min="0" max="100" step="0.1" placeholder="১০–৩০">
            </label>
          </div>
          <label class="field">ফুলের উৎস
            <select id="flora"></select>
          </label>
          <div class="err" id="err" role="alert"></div>
          <button class="btn primary" type="button" id="save">সংগ্রহ সংরক্ষণ করুন</button>
          <div class="sub">ভালো মধুতে আর্দ্রতা প্রায় ১৮–২০%। ৩০%-এর বেশি হলে সিস্টেম নেবে না।</div>
        </section>

        <section class="card">
          <div class="card-head"><h2>সেরা বাক্স</h2><span class="sub">দুই মৌসুম মিলিয়ে</span></div>
          <div id="rank"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  let season = 'now';
  const sum = (arr) => arr.reduce((s, h) => s + h.kg, 0);

  function renderKpis() {
    const now = HARVESTS.filter((h) => h.season === 'now');
    const last = HARVESTS.filter((h) => h.season === 'last');
    const avgM = HARVESTS.reduce((s, h) => s + h.moist, 0) / HARVESTS.length;
    const items = [
      { k: 'এই মৌসুমে', v: bn(Math.round(sum(now) * 10) / 10), small: 'কেজি', ic: 'harvests', c: 'honey' },
      { k: 'গত মৌসুমে', v: bn(sum(last)), small: 'কেজি', ic: 'calendar', c: 'green' },
      { k: 'গড় আর্দ্রতা', v: bn(avgM.toFixed(1)), small: '%', ic: 'flower', c: 'blue' },
      { k: 'মোট সংগ্রহ', v: bn(HARVESTS.length), small: 'বার', ic: 'hives', c: 'honey' }
    ];
    document.getElementById('kpis').innerHTML = items.map((x) =>
      `<div class="kpi"><div class="kpi-top"><span class="k">${x.k}</span><span class="kpi-ic ${x.c}">${icon(x.ic)}</span></div><div class="v">${x.v} <small>${x.small}</small></div></div>`).join('');
  }

  function renderLog() {
    const rows = HARVESTS.filter((h) => !season || h.season === season);
    document.getElementById('log').innerHTML = rows.map((h) => `
      <tr><td>${h.date}</td><td><a href="hive.html?code=${h.hive}"><b>${h.hive}</b></a></td><td>${h.flora}</td>
      <td class="num"><b>${bn(h.kg)}</b> কেজি</td>
      <td class="num"><span class="${h.moist <= 21 ? 'moist-ok' : 'moist-hi'}">${bn(h.moist)}%</span></td></tr>`).join('')
      || '<tr><td colspan="5" class="empty">কোনো সংগ্রহ নেই</td></tr>';
    document.getElementById('total').textContent = bn(Math.round(sum(rows) * 10) / 10) + ' কেজি';
  }

  // backend-এ: SELECT hive_id, SUM(kg), RANK() OVER (ORDER BY SUM(kg) DESC) ...
  function renderRank() {
    const by = {};
    HARVESTS.forEach((h) => { by[h.hive] = (by[h.hive] || 0) + h.kg; });
    const rows = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const max = rows[0][1];
    document.getElementById('rank').innerHTML = rows.map(([code, kg], i) => `
      <a class="rank-row" href="hive.html?code=${code}">
        <span class="rank ${i === 0 ? 'top' : ''}">${bn(i + 1)}</span>
        <span class="nm"><b>${code}</b><span class="progress" style="display:block;margin-top:6px"><i style="width:${Math.round(kg / max * 100)}%"></i></span></span>
        <b>${bn(Math.round(kg * 10) / 10)} কেজি</b></a>`).join('');
  }

  document.getElementById('season').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    season = b.dataset.s;
    renderLog();
  });

  const params = new URLSearchParams(location.search);
  document.getElementById('hive').innerHTML = HIVES.filter((h) => h.queen === 'আছে').map((h) => `<option>${h.code}</option>`).join('');
  if (params.get('code')) document.getElementById('hive').value = params.get('code');
  document.getElementById('flora').innerHTML = FLORA.filter((f) => !f.dearth).map((f) => `<option>${f.name}</option>`).join('') + '<option selected>মিশ্র ফুল</option>';

  // আর্দ্রতা যাচাই — database-এ CHECK (moisture BETWEEN 10 AND 30)
  document.getElementById('save').addEventListener('click', () => {
    const kg = Number(document.getElementById('kg').value);
    const moist = Number(document.getElementById('moist').value);
    const err = document.getElementById('err');
    if (!(kg > 0)) { err.textContent = 'পরিমাণ ০-এর বেশি হতে হবে'; return; }
    if (!(moist >= 10 && moist <= 30)) { err.textContent = 'আর্দ্রতা ১০% থেকে ৩০%-এর মধ্যে হতে হবে'; return; }
    err.textContent = '';
    const hive = document.getElementById('hive').value;
    HARVESTS.unshift({ date: todayShort(), month: new Date().getMonth() + 1, season: 'now', hive, flora: document.getElementById('flora').value, kg, moist });
    Store.addHiveEvent(hive, 'সংগ্রহ', 'honey', `মধু ${bn(kg)} কেজি (${HARVESTS[0].flora}) · আর্দ্রতা ${bn(moist)}%`);
    Store.save();
    document.getElementById('kg').value = ''; document.getElementById('moist').value = '';
    season = 'now';
    document.querySelectorAll('#season button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.s === 'now'));
    renderKpis(); renderLog(); renderRank();
    toast(`${hive} থেকে ${bn(kg)} কেজি মধু সংরক্ষণ হয়েছে`);
  });

  renderKpis(); renderLog(); renderRank();
</script>
</body>
</html>
