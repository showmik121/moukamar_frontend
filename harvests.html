<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মধু সংগ্রহ — মৌখামার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .err { color: var(--red); font-size: 13px; min-height: 18px; }
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-2); text-decoration: none; color: var(--ink); }
  .rank-row:hover { color: var(--ink); background: var(--soft); }
  .rank-row .nm { flex: 1; }
  .moist-ok { color: var(--green); font-weight: 600; }
  .moist-hi { color: var(--honey-ink); font-weight: 600; }
  #season { flex: none; }
  #season button { white-space: nowrap; padding: 0 14px; min-height: 36px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" data-active="hives"></aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>মধু সংগ্রহ</h1>
        <div class="sub">কোন বাক্স থেকে কবে কত কেজি, কোন ফুলের মধু</div>
      </div>
      <a class="btn primary" href="#new">+ সংগ্রহ লিখুন</a>
    </header>

    <section class="stats" id="kpis" aria-label="সারাংশ" style="margin-bottom:4px"></section>

    <div class="dash-grid">
      <div class="dash-col">
        <section class="card">
          <div class="card-head">
            <h2>সংগ্রহের তালিকা</h2>
            <div class="seg" role="group" aria-label="বছর" id="season">
              <button type="button" aria-pressed="true" data-s="now">এ বছর</button>
              <button type="button" aria-pressed="false" data-s="last">গত বছর</button>
              <button type="button" aria-pressed="false" data-s="">সব</button>
            </div>
          </div>
          <div class="table-wrap">
            <table style="min-width:600px">
              <thead><tr><th>তারিখ</th><th>বাক্স</th><th>ফুলের উৎস</th><th class="num">পরিমাণ</th><th class="num">আর্দ্রতা</th></tr></thead>
              <tbody id="log"></tbody>
              <tfoot><tr><td colspan="3"><b>মোট</b></td><td class="num"><b id="total"></b></td><td></td></tr></tfoot>
            </table>
          </div>
        </section>
      </div>

      <div class="dash-col">
        <section class="card" id="new">
          <h2>নতুন সংগ্রহ</h2>
          <label class="field">বাক্স
            <select id="hive"></select>
          </label>
          <div class="row" style="gap:12px">
            <label class="field grow-1" style="flex-basis:120px">পরিমাণ (কেজি)
              <input type="number" id="kg" min="0" step="0.1" placeholder="যেমন ১২.৫">
            </label>
            <label class="field grow-1" style="flex-basis:120px">আর্দ্রতা (%)
              <input type="number" id="moist" min="0" max="100" step="0.1" placeholder="১০–৩০">
            </label>
          </div>
          <label class="field">ফুলের উৎস
            <select id="flora"></select>
          </label>
          <label class="field">তারিখ
            <input type="date" id="date">
          </label>
          <label class="field">মন্তব্য
            <input type="text" id="notes" placeholder="ঐচ্ছিক">
          </label>
          <div class="err" id="err" role="alert"></div>
          <button class="btn primary" type="button" id="save">সংগ্রহ সংরক্ষণ করুন</button>
          <div class="sub">ভালো মধুতে আর্দ্রতা প্রায় ১৮–২০%। ৩০%-এর বেশি হলে সিস্টেম নেবে না। আর্দ্রতা না মাপলে ঘরটা খালি রাখুন।</div>
        </section>

        <section class="card">
          <div class="card-head"><h2>সেরা বাক্স</h2><span class="sub">সব সংগ্রহ মিলিয়ে</span></div>
          <div id="rank"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  // মধু সংগ্রহ — তালিকা, সারাংশ, সেরা বাক্স আর নতুন সংগ্রহ লেখা।
  // মৌসুম = ক্যালেন্ডার বছর (backend-এর sp_season_report-ও বছর ধরে হিসাব করে)।
  // লেখার কাজ sp_add_harvest procedure করে — আর্দ্রতা, পরিমাণ আর তারিখ যাচাই,
  // মধু সংগ্রহ লেখা আর বাক্সের ইতিহাসে ঘটনা, একটা transaction-এ।
  const $ = (id) => document.getElementById(id);
  const THIS_YEAR = new Date().getFullYear();
  const yearOf = (h) => Number(String(h.date).slice(0, 4));
  const SEASON = { now: (h) => yearOf(h) === THIS_YEAR, last: (h) => yearOf(h) === THIS_YEAR - 1, '': () => true };
  const round = (n) => Math.round(n * 100) / 100;
  const sum = (arr) => round(arr.reduce((s, h) => s + h.kg, 0));
  let season = 'now';

  function renderKpis() {
    const withM = HARVESTS.filter((h) => h.moisture !== null && h.moisture !== undefined);
    const avgM = withM.length ? withM.reduce((s, h) => s + h.moisture, 0) / withM.length : null;
    const items = [
      { k: `এ বছর (${bn(String(THIS_YEAR))})`, v: bn(sum(HARVESTS.filter(SEASON.now))), small: 'কেজি', ic: 'harvests', c: 'honey' },
      { k: `গত বছর (${bn(String(THIS_YEAR - 1))})`, v: bn(sum(HARVESTS.filter(SEASON.last))), small: 'কেজি', ic: 'calendar', c: 'green' },
      { k: 'গড় আর্দ্রতা', v: avgM === null ? '—' : bn(avgM.toFixed(1)), small: avgM === null ? '' : '%', ic: 'flower', c: 'blue' },
      { k: 'মোট সংগ্রহ', v: bn(HARVESTS.length), small: 'বার', ic: 'hives', c: 'honey' }
    ];
    // .stat — style.css-এ সাজানো (আগের .kpi ক্লাসের কোনো CSS ছিল না)
    $('kpis').innerHTML = items.map((x) =>
      `<div class="stat"><div class="k">${x.k}</div><div class="v${x.c === 'honey' ? ' honey' : ''}">${x.v} <small style="font-size:15px;font-weight:500">${x.small}</small></div></div>`).join('');
  }

  function renderLog() {
    const rows = HARVESTS.filter(SEASON[season]);
    $('log').innerHTML = rows.map((h) => `
      <tr><td>${MK.date(h.date)}</td><td><a href="hive.html?code=${encodeURIComponent(h.hive)}"><b>${escapeHtml(h.hive)}</b></a></td><td>${escapeHtml(h.flora || 'মিশ্র ফুল')}</td>
      <td class="num"><b>${bn(h.kg)}</b> কেজি</td>
      <td class="num">${h.moisture === null ? '<span class="sub">—</span>' : `<span class="${h.moisture <= 21 ? 'moist-ok' : 'moist-hi'}">${bn(h.moisture)}%</span>`}</td></tr>`).join('')
      || '<tr><td colspan="5" class="empty">এই সময়ে কোনো সংগ্রহ নেই</td></tr>';
    $('total').textContent = bn(sum(rows)) + ' কেজি';
  }

  // backend-এ একই হিসাব: SELECT hive_id, SUM(kg) ... GROUP BY hive_id ORDER BY 2 DESC
  function renderRank() {
    const by = {};
    HARVESTS.forEach((h) => { by[h.hive] = (by[h.hive] || 0) + h.kg; });
    const rows = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 5);
    if (!rows.length) {
      $('rank').innerHTML = '<div class="empty">এখনো কোনো মধু সংগ্রহ লেখা হয়নি</div>';
      return;
    }
    const max = rows[0][1];
    $('rank').innerHTML = rows.map(([code, kg], i) => `
      <a class="rank-row" href="hive.html?code=${encodeURIComponent(code)}">
        <span class="rank ${i === 0 ? 'top' : ''}">${bn(i + 1)}</span>
        <span class="nm"><b>${escapeHtml(code)}</b><span class="progress" style="display:block;margin-top:6px"><i style="width:${Math.round(kg / max * 100)}%"></i></span></span>
        <b>${bn(round(kg))} কেজি</b></a>`).join('');
  }

  function setSeason(s) {
    season = s;
    document.querySelectorAll('#season button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.s === s)));
    renderLog();
  }

  function renderAll() {
    renderKpis(); renderLog(); renderRank();
  }

  MK.start(['hives', 'harvests', 'flora'], () => {
    const params = new URLSearchParams(location.search);
    const hiveSel = $('hive');
    hiveSel.innerHTML = HIVES.map((h) => `<option value="${h.id}">${escapeHtml(h.code)} · ${escapeHtml(h.farmName)}${h.queen === 'নেই' ? ' (রানীহীন)' : ''}</option>`).join('');
    const fromUrl = HIVES.find((h) => h.code === params.get('code'));
    if (fromUrl) hiveSel.value = String(fromUrl.id);
    $('flora').innerHTML = FLORA.filter((f) => !f.dearth).map((f) => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('')
      + '<option value="" selected>মিশ্র ফুল</option>';
    $('date').value = isoDate();
    $('date').max = isoDate();
    if (!HIVES.length) {
      $('save').disabled = true;
      $('err').textContent = 'আগে "খামার ও বাক্স" পাতা থেকে একটা বাক্স যোগ করুন';
    }

    $('season').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b) setSeason(b.dataset.s);
    });

    // আর্দ্রতার নিয়ম ডাটাবেজেও আছে — CHECK (moisture <= 30) আর sp_add_harvest
    $('save').addEventListener('click', async (e) => {
      const err = $('err');
      const hive = HIVES.find((h) => h.id === Number(hiveSel.value));
      const kg = Number($('kg').value);
      const moistRaw = $('moist').value.trim();
      const moist = moistRaw === '' ? null : Number(moistRaw);
      if (!hive) { err.textContent = 'বাক্স বাছুন'; return; }
      if (!$('date').value) { err.textContent = 'তারিখ দিন'; return; }
      if (!(kg > 0)) { err.textContent = 'পরিমাণ ০-এর বেশি হতে হবে'; return; }
      if (moist !== null && !(moist >= 10 && moist <= 30)) { err.textContent = 'আর্দ্রতা ১০% থেকে ৩০%-এর মধ্যে হতে হবে'; return; }
      err.textContent = '';
      e.target.disabled = true;
      try {
        const floraId = $('flora').value;
        await API.post('harvests/', {
          hive: hive.id, date: $('date').value, kg, moisture: moist,
          flora: floraId ? Number(floraId) : null, notes: $('notes').value.trim()
        });
        await MK.load('harvests');
        $('kg').value = ''; $('moist').value = ''; $('notes').value = '';
        renderAll();
        setSeason(yearOf({ date: $('date').value }) === THIS_YEAR ? 'now' : '');
        toast(`${hive.code} থেকে ${bn(kg)} কেজি মধু সংরক্ষণ হয়েছে`);
      } catch (ex) {
        err.textContent = ex.message || 'সংগ্রহ সংরক্ষণ হয়নি';
      } finally {
        e.target.disabled = false;
      }
    });

    renderAll();
  });
</script>
</body>
</html>
